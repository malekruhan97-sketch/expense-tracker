<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h2 class="text-center mb-4">Expense Tracker</h2>

    <div class="row g-3 mb-4 text-center">
      <div class="col-md-4"><div class="card p-3"><small>Balance</small><h3 id="balance">₹0</h3></div></div>
      <div class="col-md-4"><div class="card p-3 text-success"><small>Income</small><h3 id="income">₹0</h3></div></div>
      <div class="col-md-4"><div class="card p-3 text-danger"><small>Kharcha</small><h3 id="expense">₹0</h3></div></div>
    </div>

    <div class="row g-4">
      <div class="col-md-5">
        <div class="card p-3">
          <h5>Nayi entry</h5>
          <input id="title" class="form-control mb-2" placeholder="Title (jaise Chai)">
          <input id="amount" type="number" class="form-control mb-2" placeholder="Amount">
          <select id="type" class="form-select mb-2">
            <option value="expense">Kharcha</option>
            <option value="income">Income</option>
          </select>
          <select id="category" class="form-select mb-3">
            <option>Khana</option><option>Travel</option><option>Shopping</option>
            <option>Padhai</option><option>Salary</option><option>Other</option>
          </select>
          <button id="addBtn" class="btn btn-primary">Add karo</button>
        </div>
        <div class="card p-3 mt-3">
          <h5>Category wise kharcha</h5>
          <canvas id="chart" height="220"></canvas>
        </div>
      </div>
      <div class="col-md-7">
        <div class="card p-3">
          <h5>History</h5>
          <ul id="history" class="list-group list-group-flush"></ul>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
